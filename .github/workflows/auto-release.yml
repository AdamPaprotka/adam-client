name: Auto Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  auto-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine commits since last release
        id: count
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COUNT=$(git rev-list --count HEAD)
          else
            COUNT=$(git rev-list --count "$LAST_TAG"..HEAD)
          fi
          echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Commits since last release ($LAST_TAG): $COUNT"

      - name: Compute next version
        id: version
        if: steps.count.outputs.count >= 3
        run: |
          LAST_TAG="${{ steps.count.outputs.last_tag }}"
          if [ -z "$LAST_TAG" ]; then
            NEXT="v1.0.0"
          else
            VER=${LAST_TAG#v}
            MAJOR=$(echo "$VER" | cut -d. -f1)
            MINOR=$(echo "$VER" | cut -d. -f2)
            PATCH=$(echo "$VER" | cut -d. -f3)
            NEXT="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        if: steps.count.outputs.count >= 3
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        if: steps.count.outputs.count >= 3
        run: ./gradlew build -x test --console=plain

      - name: Create tag and release
        if: steps.count.outputs.count >= 3
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          JAR=$(find build/libs -maxdepth 1 -name "*.jar" ! -name "*-sources.jar" | head -1)
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" "$JAR" \
            --title "$TAG" \
            --notes "Automated release after ${{ steps.count.outputs.count }} commits since ${{ steps.count.outputs.last_tag }}."
